server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态站路由：优先精确文件 → 目录下 index.html → .html 后缀 → 404
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # 静态资源长期缓存（文件名带 hash）
    location ~* \.(?:css|js|woff2?|ttf|png|jpe?g|gif|svg|ico|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Pagefind 搜索索引中等缓存
    location /pagefind/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
